# 把下面这段插入 aliyun 的 /etc/caddy/Caddyfile 中 wkeeli.cn { ... } 块内，
# 位置：兜底语句 `reverse_proxy localhost:5000` 之前（建议紧跟最后一个 handle_path 块）。
# 之后：caddy validate --config /etc/caddy/Caddyfile && systemctl reload caddy

	# ===== pc2mb 云远控（dev 机反向隧道 127.0.0.1:18091）=====
	redir /pc2mb /pc2mb/ 308
	handle_path /pc2mb/* {
		reverse_proxy http://127.0.0.1:18091 {
			header_up X-Forwarded-Prefix /pc2mb
		}
	}
